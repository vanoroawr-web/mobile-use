name: Build Android APK Manually

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Mencari gradlew secara otomatis di semua sub-folder dan memberikan izin
      - name: Grant Execute Permission for Gradlew
        run: |
          GRADLEW_PATH=$(find . -name gradlew | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: File gradlew benar-benar tidak ditemukan di repositori ini!"
            exit 1
          fi
          echo "Gradlew ditemukan di: $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"
          echo "GRADLEW_DIR=$(dirname "$GRADLEW_PATH")" >> $GITHUB_ENV

      # Menjalankan build di folder tempat gradlew berada
      - name: Build Debug APK
        run: |
          cd ${{ env.GRADLEW_DIR }}
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
